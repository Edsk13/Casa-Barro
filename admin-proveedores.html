<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <main class="admin-main crm-main-bg">
            <header class="admin-header">
                <div>
                    <h1>Proveedores</h1>
                    <p style="color: #777;">Administración de proveedores de insumos</p>
                </div>

                <div class="admin-user">
                    <span id="admin-user-name">Cargando...</span>
                </div>
            </header>

            <!-- ALTA DE PROVEEDOR -->
            <div class="crm-card" style="margin-top: 20px;">
                <h2>Nuevo Proveedor</h2>

                <form
                    id="form-alta-proveedor"
                    style="display:grid; grid-template-columns:repeat(2, 1fr); gap:15px; margin-top:20px;"
                >
                    <div>
                        <label for="proveedor-nombre" style="font-weight:bold; color:var(--verde-logo);">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="proveedor-nombre"
                            placeholder="Nombre del proveedor"
                            required
                            style="width:100%; margin-top:6px; padding:10px 12px; border:1px solid #ccc; border-radius:8px;"
                        >
                    </div>

                    <div>
                        <label for="proveedor-contacto" style="font-weight:bold; color:var(--verde-logo);">
                            Contacto
                        </label>

                        <input
                            type="text"
                            id="proveedor-contacto"
                            placeholder="Nombre del contacto"
                            style="width:100%; margin-top:6px; padding:10px 12px; border:1px solid #ccc; border-radius:8px;"
                        >
                    </div>

                    <div>
                        <label for="proveedor-correo" style="font-weight:bold; color:var(--verde-logo);">
                            Correo
                        </label>

                        <input
                            type="email"
                            id="proveedor-correo"
                            placeholder="correo@proveedor.com"
                            style="width:100%; margin-top:6px; padding:10px 12px; border:1px solid #ccc; border-radius:8px;"
                        >
                    </div>

                    <div>
                        <label for="proveedor-telefono" style="font-weight:bold; color:var(--verde-logo);">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            id="proveedor-telefono"
                            placeholder="Teléfono"
                            style="width:100%; margin-top:6px; padding:10px 12px; border:1px solid #ccc; border-radius:8px;"
                        >
                    </div>

                    <div style="grid-column:1 / -1; display:flex; justify-content:flex-end;">
                        <button
                            type="submit"
                            class="btn-primary"
                            style="width:auto; padding:8px 16px; font-size:0.9rem; border-radius:16px;"
                        >
                            Guardar Proveedor
                        </button>
                    </div>
                </form>
            </div>

            <!-- FILTROS -->
            <div class="crm-card">
                <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                    <input
                        type="text"
                        id="proveedor-busqueda"
                        placeholder="Buscar proveedor..."
                        style="flex:2; min-width:220px; padding:10px 12px; border:1px solid #ccc; border-radius:8px;"
                    >

                    <select
                        id="proveedor-estado"
                        style="flex:1; min-width:160px; padding:10px 12px; border:1px solid #ccc; border-radius:8px; background:white;"
                    >
                        <option value="todos">Todos los estados</option>
                        <option value="activo">Activos</option>
                        <option value="inactivo">Inactivos</option>
                    </select>
                </div>
            </div>

            <!-- TABLA DE PROVEEDORES -->
            <div class="crm-card">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Proveedor</th>
                                <th>Contacto</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-proveedores">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
