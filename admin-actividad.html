<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Actividad | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <main class="admin-main crm-main-bg">
            <header class="admin-header">
                <div>
                    <h1>Mi Actividad</h1>
                    <p style="color: #777;">Historial de movimientos y acciones realizadas en el sistema</p>
                </div>

                <div class="admin-user">
                    <span id="admin-user-name">Cargando...</span>
                </div>
            </header>

            <!-- FILTROS DE BITÁCORA -->
            <div class="crm-card" style="margin-top: 20px; max-width: 1000px;">
                <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                    <input
                        type="text"
                        id="actividad-busqueda"
                        placeholder="Buscar en mi actividad..."
                        oninput="filtrarMiActividad()"
                        style="flex:2; min-width:220px; padding:10px 12px; border:1px solid #ccc; border-radius:8px;"
                    >

                    <select
                        id="actividad-filtro"
                        onchange="filtrarMiActividad()"
                        style="flex:1; min-width:160px; padding:10px 12px; border:1px solid #ccc; border-radius:8px; background:white;"
                    >
                        <option value="todos">Todas las acciones</option>
                        <option value="ALTA">Altas</option>
                        <option value="EDICION">Ediciones</option>
                        <option value="BAJA">Bajas</option>
                        <option value="CRM">CRM</option>
                        <option value="SESION">Sesiones</option>
                        <option value="PEDIDO">Pedidos</option>
                        <option value="INVENTARIO">Inventario</option>
                        <option value="LOGISTICA">Logística</option>
                    </select>

                    <select
                        id="actividad-modulo"
                        onchange="filtrarMiActividad()"
                        style="flex:1; min-width:160px; padding:10px 12px; border:1px solid #ccc; border-radius:8px; background:white;"
                    >
                        <option value="todos">Todos los módulos</option>
                        <option value="Sistema">Sistema</option>
                        <option value="Clientes">Clientes</option>
                        <option value="Personal">Personal</option>
                        <option value="Configuración">Configuración</option>
                        <option value="Pedidos">Pedidos</option>
                        <option value="Inventario">Inventario</option>
                        <option value="Logística">Logística</option>
                    </select>
                </div>
            </div>

            <!-- LÍNEA DE TIEMPO -->
            <div class="crm-card" style="max-width: 1000px;">
                <div
                    id="timeline-actividad"
                    style="display:flex; flex-direction:column; gap:18px; padding:10px 0;"
                >
                    <p style="color:#777; text-align:center; padding:20px;">Cargando actividad...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
