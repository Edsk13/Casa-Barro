<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="catalogo-container">
        <h1 class="catalogo-titulo">Ofertas Especiales</h1>
        <p class="catalogo-subtitulo">Aprovecha nuestros descuentos y promociones de lealtad.</p>

        <!-- Las promociones vigentes se cargan desde /api/promociones -->
        <h2 class="categoria-titulo">Promos vigentes</h2>
        <div class="promo-grid" id="promos-generales">
            <p style="color:#777;">Cargando promociones...</p>
        </div>

        <h2 class="categoria-titulo" id="titulo-promos-registrados">Club Casa Barro</h2>
        <div class="promo-grid" id="promos-registrados"></div>
    </main>

    <div id="footer-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
