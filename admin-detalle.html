<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Cliente | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>
        <main class="admin-main crm-main-bg">
            <header class="admin-header">
                <div>
                    <h1>Perfil del Cliente</h1>
                    <a href="admin-clientes.html" style="color: #777; text-decoration: underline; font-weight: bold;">< Volver al Directorio</a>
                </div>
                <div class="admin-user">
                    <span id="admin-user-name">Cargando...</span>
                </div>
            </header>

            <div class="admin-grid-2" style="margin-top: 20px;">
                <div class="crm-card" style="height: fit-content;">
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                        <div id="det-avatar" style="width: 50px; height: 50px; background: var(--verde-logo); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold;">-</div>
                        <div>
                            <h2 id="det-nombre" style="color: var(--verde-logo); margin: 0;">Cargando...</h2>
                            <span id="det-etapa" class="badge badge-prospecto" style="margin-top: 5px;">-</span>
                        </div>
                    </div>
                    <ul style="list-style: none; padding: 0; color: #555; line-height: 2.2;">
                        <li><strong>Correo:</strong> <span id="det-correo">-</span></li>
                        <li><strong>Teléfono:</strong> <span id="det-tel">-</span></li>
                        <li><strong>Empresa:</strong> <span id="det-emp">-</span></li>
                    </ul>
                </div>

                <div class="crm-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
                        <h3 style="color: var(--verde-logo); margin: 0;">Actividad y Contacto</h3>
                    </div>
                    <ul class="activity-list" id="lista-historial">
                        <li><p style="color:#777;">Cargando historial...</p></li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if(!id) return;

        const resClientes = await fetch('http://localhost:3000/api/clientes');
        const dataClientes = await resClientes.json();
        const cliente = dataClientes.data.find(c => c.id == id);

        if(cliente) {
            document.getElementById('det-nombre').innerText = cliente.nombre;
            document.getElementById('det-avatar').innerText = cliente.nombre.charAt(0).toUpperCase();
            document.getElementById('det-correo').innerText = cliente.correo;
            document.getElementById('det-tel').innerText = cliente.telefono || 'N/A';
            document.getElementById('det-emp').innerText = cliente.empresa || 'N/A';
            document.getElementById('det-etapa').innerText = cliente.etapa_crm;
            document.getElementById('det-etapa').className = cliente.etapa_crm === 'Activo' || cliente.etapa_crm === 'Frecuente' ? 'badge badge-activo' : 'badge badge-prospecto';
        }

        const resHist = await fetch(`http://localhost:3000/api/clientes/${id}/interacciones`);
        const dataHist = await resHist.json();
        
        let htmlHistorial = '';
        if(dataHist.data.length === 0) {
            htmlHistorial = '<li><p style="color:#777; text-align:center;">Aún no hay contactos registrados.</p></li>';
        } else {
            dataHist.data.forEach(int => {
                let iconoSvg = '';
                if (int.tipo === 'Llamada') {
                    iconoSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`;
                } else if (int.tipo === 'Correo') {
                    iconoSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>`;
                } else { // Mensaje
                    iconoSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;
                }
                
                let fechaFormat = new Date(int.fecha).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
                
                htmlHistorial += `
                    <li style="border-bottom: 1px dashed #eae5db; padding-bottom: 15px; margin-bottom: 15px;">
                        <span style="font-size: 0.85rem; color: #888; display: block; margin-bottom: 8px;">${fechaFormat}</span>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                            <span style="color: var(--verde-logo); display: flex;">${iconoSvg}</span>
                            <strong style="color: #3c4a45; font-size: 1.05rem;">${int.tipo}</strong>
                        </div>
                        <p style="font-size: 0.95rem; color:#555; margin: 0;">${int.descripcion}</p>
                    </li>
                `;
            });
        }
        document.getElementById('lista-historial').innerHTML = htmlHistorial;
    });
</script>
</body>
</html>
