<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Empleado | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>
        <main class="admin-main crm-main-bg">
            <header class="admin-header">
                <div>
                    <h1>Perfil de Empleado</h1>
                    <a href="admin-personal.html" style="color: #777; text-decoration: underline; font-weight: bold;">< Volver al Equipo</a>
                </div>
                <div class="admin-user">
                    <span id="admin-user-name">Cargando...</span>
                </div>
            </header>

            <div class="crm-card" style="margin-top: 20px; max-width: 600px;">
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 25px;">
                    <div id="det-avatar" style="width: 60px; height: 60px; background: var(--verde-logo); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold;">-</div>
                    <div>
                        <h2 id="det-nombre" style="color: var(--verde-logo); margin: 0;">Cargando...</h2>
                        <span id="det-rol" class="badge" style="margin-top: 5px; text-transform:uppercase;">-</span>
                    </div>
                </div>
                <ul style="list-style: none; padding: 0; color: #555; line-height: 2.4; font-size: 1.05rem;">
                    <li><strong>Correo Electrónico:</strong> <span id="det-correo">-</span></li>
                    <li><strong>Teléfono de Contacto:</strong> <span id="det-tel">-</span></li>
                </ul>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if(!id) return;

            const res = await fetch('http://localhost:3000/api/personal');
            const data = await res.json();
            const empleado = data.data.find(e => e.id == id);

            if(empleado) {
                document.getElementById('det-nombre').innerText = empleado.nombre;
                document.getElementById('det-avatar').innerText = empleado.nombre.charAt(0).toUpperCase();
                document.getElementById('det-correo').innerText = empleado.correo;
                document.getElementById('det-tel').innerText = empleado.telefono || 'No registrado';
                
                const badge = document.getElementById('det-rol');
                badge.innerText = empleado.rol;
                badge.style.backgroundColor = empleado.rol === 'admin' ? '#b7410e' : '#557268';
            }
        });
    </script>
</body>
</html>
