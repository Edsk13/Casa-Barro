<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Menú | Casa Barro
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>

</head>


<body>


    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <div id="navbar-container"></div>



    <!-- ==========================================
         CATÁLOGO
    =========================================== -->

    <main class="catalogo-container">


        <!-- TÍTULO -->

        <h1 class="catalogo-titulo">
            Nuestro Menú
        </h1>


        <p class="catalogo-subtitulo">
            Elige tus favoritos para disfrutar aquí o llevar a casa.
        </p>



        <!-- ======================================
             FILTROS
        ======================================= -->

        <div class="filtros-container">


            <input
                type="text"
                id="buscador-productos"
                placeholder="Buscar enchiladas, frappé, waffles..."
                autocomplete="off"
            >


            <select id="filtro-categoria">

                <option value="todos">
                    Todas las categorías
                </option>

                <option value="alimentos">
                    Alimentos
                </option>

                <option value="calientes">
                    Bebidas Calientes
                </option>

                <option value="frias">
                    Bebidas Frías
                </option>

                <option value="postres">
                    Postres
                </option>

            </select>


        </div>



        <!-- ======================================
             ALIMENTOS
        ======================================= -->

        <div
            class="seccion-categoria"
            data-categoria="alimentos"
        >


            <h2 class="categoria-titulo">
                Alimentos
            </h2>


            <div
                class="grid-productos"
                id="catalogo-alimentos"
            >

                <!--
                    Los productos de esta categoría
                    se cargan automáticamente desde
                    SQLite mediante app.js
                -->

            </div>


        </div>



        <!-- ======================================
             BEBIDAS CALIENTES
        ======================================= -->

        <div
            class="seccion-categoria"
            data-categoria="calientes"
        >


            <h2 class="categoria-titulo">
                Bebidas Calientes
            </h2>


            <div
                class="grid-productos"
                id="catalogo-calientes"
            >

                <!-- Productos dinámicos -->

            </div>


        </div>



        <!-- ======================================
             BEBIDAS FRÍAS
        ======================================= -->

        <div
            class="seccion-categoria"
            data-categoria="frias"
        >


            <h2 class="categoria-titulo">
                Bebidas Frías
            </h2>


            <div
                class="grid-productos"
                id="catalogo-frias"
            >

                <!-- Productos dinámicos -->

            </div>


        </div>



        <!-- ======================================
             POSTRES
        ======================================= -->

        <div
            class="seccion-categoria"
            data-categoria="postres"
        >


            <h2 class="categoria-titulo">
                Postres
            </h2>


            <div
                class="grid-productos"
                id="catalogo-postres"
            >

                <!-- Productos dinámicos -->

            </div>


        </div>


    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <div id="footer-container"></div>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/app.js"></script>


</body>

</html>
