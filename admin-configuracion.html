<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Cuenta | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>
        <main class="admin-main crm-main-bg">
            <header class="admin-header">
                <div>
                    <h1>Configuración de Cuenta</h1>
                    <p style="color: #777;">Actualiza tus datos de acceso al panel</p>
                </div>
                <div class="admin-user">
                    <span id="admin-user-name">Cargando...</span>
                </div>
            </header>

            <div class="crm-card" style="margin-top: 20px; max-width: 600px;">
                <h3 style="color: var(--verde-logo); margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; border-bottom: 2px solid #fcf9f2; padding-bottom: 10px;">Mis Datos</h3>
                <form id="form-configuracion" onsubmit="guardarConfiguracion(event)" style="display: flex; flex-direction: column; gap: 20px;">
                    
                    <div>
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555; display:block; margin-bottom:5px;">Nombre Completo</label>
                        <input type="text" id="conf-nombre" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit;">
                    </div>
                    
                    <div>
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555; display:block; margin-bottom:5px;">Correo Electrónico (Usuario)</label>
                        <input type="email" id="conf-correo" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit;">
                    </div>

                    <div>
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555; display:block; margin-bottom:5px;">Teléfono de Contacto</label>
                        <input type="text" id="conf-telefono" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit;" placeholder="Ej. 4491234567">
                    </div>

                    <div>
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555; display:block; margin-bottom:5px;">Contraseña de Acceso</label>
                        <input type="text" id="conf-pass" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit;">
                        <small style="color:#888;">Puedes escribir una nueva para cambiarla, o dejar la actual.</small>
                    </div>

                    <button type="submit" class="btn-primary" style="padding: 12px; border-radius: 8px; font-size: 1rem; width: 100%; margin-top: 10px;">Guardar Cambios</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('casaBarro_usuario'));
            if(user) {
                document.getElementById('conf-nombre').value = user.nombre;
                document.getElementById('conf-correo').value = user.correo;
                document.getElementById('conf-pass').value = user.password || ''; 
                document.getElementById('conf-telefono').value = user.telefono || ''; 
            }
        });
    </script>
</body>
</html>
