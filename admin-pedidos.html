<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>
        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h1>Gestión de Pedidos</h1>
                    <p style="color: #777;">Controla las órdenes entrantes y su estado de preparación.</p>
                </div>
            </header>

            <div class="admin-toolbar">
                <input type="text" placeholder="Buscar por # de pedido o cliente...">
                <select>
                    <option value="todos">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="preparacion">En Preparación</option>
                    <option value="entregado">Entregados</option>
                </select>
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th># Pedido</th>
                            <th>Cliente</th>
                            <th>Fecha y Hora</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>#125</strong></td>
                            <td>Sofía Ramírez</td>
                            <td>Hoy, 10:45 AM</td>
                            <td>$245.00</td>
                            <td><span class="badge-status pendiente">Pendiente</span></td>
                            <td class="admin-actions">
                                <button onclick="verDetallePedidoAdmin('#125')">Ver</button>
                                <button onclick="cambiarEstadoPedidoAdmin(this)">Avanzar Estado</button>
                            </td>
                        </tr>
                        <tr>
                            <td><strong>#124</strong></td>
                            <td>Carlos Gómez</td>
                            <td>Hoy, 09:30 AM</td>
                            <td>$180.00</td>
                            <td><span class="badge-status preparacion">En Preparación</span></td>
                            <td class="admin-actions">
                                <button onclick="verDetallePedidoAdmin('#124')">Ver</button>
                                <button onclick="cambiarEstadoPedidoAdmin(this)">Avanzar Estado</button>
                            </td>
                        </tr>
                        <tr>
                            <td><strong>#123</strong></td>
                            <td>Mariana López</td>
                            <td>Ayer, 01:15 PM</td>
                            <td>$310.00</td>
                            <td><span class="badge-status entregado">Entregado</span></td>
                            <td class="admin-actions">
                                <button onclick="verDetallePedidoAdmin('#123')">Ver</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
