<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo de Trabajo | Casa Barro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>
        <main class="admin-main crm-main-bg">
            <header class="admin-header">
                <div>
                    <h1>Equipo de Trabajo</h1>
                    <p style="color: #777;">Gestión de Administradores, Vendedores y Logística</p>
                </div>
                <div class="admin-user">
                    <span id="admin-user-name">Cargando...</span>
                </div>
            </header>

            <div class="crm-card" style="margin-top: 20px;">
                <h3 style="color: var(--verde-logo); margin-top: 0; margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #fcf9f2; padding-bottom: 10px;">Registrar Empleado</h3>
                <form id="form-alta-personal" onsubmit="guardarPersonal(event)" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
                    <div style="flex: 1; min-width: 200px;">
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Nombre *</label>
                        <input type="text" id="emp-nombre" required style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Correo *</label>
                        <input type="email" id="emp-correo" required style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Contraseña *</label>
                        <input type="password" id="emp-pass" required style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Teléfono</label>
                        <input type="text" id="emp-telefono" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label style="font-size: 0.85rem; font-weight: bold; color: #555;">Rol de empleado *</label>
                        <select id="emp-rol" required style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;">
                            <option value="vendedor">Vendedor</option>
                            <option value="logistica">Logística</option>
                            <option value="admin">Administrador Maestro</option>
                        </select>
                    </div>
                    <div>
                        <button type="submit" class="btn-primary" style="padding: 9px 20px; height: 40px; border-radius: 8px; font-size: 0.95rem;">Registrar</button>
                    </div>
                </form>
            </div>

            <div class="admin-toolbar" style="justify-content: space-between; margin-top: 20px;">
                <input type="text" id="personal-search" onkeyup="filtrarPersonal()" placeholder="Buscar empleado por nombre o correo..." style="max-width: 400px; padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc;">
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Empleado</th>
                            <th>Rol / Puesto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-personal">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
